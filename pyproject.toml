[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recoup"
version = "0.1.0"
description = "Revenue recovery agent for Indian payments — measured incremental recovery against a holdout"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
recoup = "recoup.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["recoup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Tests here are functions, never classes. Left at the default, pytest tries to
# collect any imported class named Test* — including the TestModeViolation
# exception — and warns that it cannot.
python_classes = ["*Tests"]
markers = [
    "slow: runs a real evaluation. Deselect with -m 'not slow'.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
