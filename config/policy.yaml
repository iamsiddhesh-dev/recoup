# ============================================================================
# Recoup — policy engine
# ============================================================================
# The agent MAY read this file. Nothing here is ground truth: these are the
# agent's own beliefs and costs, and it is free to be wrong about them. That is
# the point — the world in config/world.yaml decides what actually happens.
#
# Decision rule, per failure:
#
#   EV(action) = P(recover | cause, issuer, attempt_n, hour, context)
#                × amount × margin
#              − cost(action)
#              − annoyance_penalty(customer_contact_history)
#
#   choose argmax EV, then submit it to the compliance gate, which may veto.
#
# No model is in this loop. Action selection is arithmetic, and every decision
# reports the numbers that produced it. See DECISIONS.md.
# ============================================================================

# Assumed contribution margin on recovered revenue. The agent optimises margin,
# not gross — chasing a ₹200 recovery with a ₹120 human escalation is negative EV
# even though it "recovers money".
assumed_margin: 0.28

# ---------------------------------------------------------------------------
# Action costs, in paise
# ---------------------------------------------------------------------------
# Retries are near-free per attempt but not free in aggregate: repeated failed
# authorisations against one instrument degrade the issuer relationship, which
# is modelled as a small escalating cost rather than zero.
action_costs:
  RETRY_NOW:        200
  RETRY_SCHEDULED:  200
  NUDGE_SMS:         15
  NUDGE_WHATSAPP:    35
  NUDGE_EMAIL:        3
  NUDGE_VOICE:      120
  ESCALATE_HUMAN: 12000
  STOP:               0

# Deliberately absent: SWITCH_ROUTE.
#
# Re-routing a payment to a different acquirer is a real recovery lever and one
# Razorpay itself sells. It is not exposed on the standard payments API, so
# Recoup could propose it but could never execute it — and an action that only
# works in the simulator is exactly the divergence the adapter seam exists to
# prevent. Modelling it would inflate results by pricing in a lever we do not
# have. See DECISIONS.md.

# Multiplier applied to retry cost per prior attempt on the same instrument.
retry_cost_escalation: 1.8

# ---------------------------------------------------------------------------
# Annoyance
# ---------------------------------------------------------------------------
# The long-term cost of over-contacting a customer. Without this the optimiser
# will nudge everyone constantly, because each individual nudge looks cheap and
# slightly positive. Modelling goodwill as a real cost is what separates a
# recovery product from a spam cannon.
annoyance:
  penalty_per_prior_contact: 900   # paise, applied per contact in the trailing window
  window_days: 7
  escalation: 1.6                  # superlinear: the third contact hurts more than the second

# ---------------------------------------------------------------------------
# The agent's prior beliefs about recovery
# ---------------------------------------------------------------------------
# Deliberately NOT copied from world.yaml. The agent starts with a rough,
# slightly wrong prior and refines it from observed outcomes within the run.
# If these matched the world exactly the evaluation would be meaningless.
prior_recovery_probability:
  SOFT_ISSUER_DECLINE: 0.30
  INSUFFICIENT_FUNDS:  0.25
  AUTH_ABANDONED:      0.40
  TECHNICAL_GATEWAY:   0.55
  INSTRUMENT_INVALID:  0.05
  RISK_BLOCKED:        0.00
  MANDATE_PROBLEM:     0.10
  CUSTOMER_INTENT:     0.15

# Minimum observations before the learned model overrides the prior for a
# (cause, issuer, hour) cell. Below this, fall back to the prior — a single
# lucky recovery must not move the policy.
learning:
  min_observations: 25
  blend: shrinkage        # shrink toward the prior, weighted by sample size

# ---------------------------------------------------------------------------
# Customer contact
# ---------------------------------------------------------------------------
# A nudge recovers money only if two things happen: the customer acts, and then
# completes the payment. Separating them matters because they fail for different
# reasons and only the first is affected by how often we have already written.
nudge:
  prior_response: 0.22        # they do something
  prior_completion: 0.68      # having acted, they finish
  decay_per_prior_contact: 0.45

  # The agent's belief about channel effectiveness, relative to SMS. Deliberately
  # close to but not identical with the world's true values — it is allowed to be
  # somewhat wrong, and correcting it is exactly what the learned model is for.
  #
  # Without this the agent picks purely on cost and emails everyone forever, which
  # is correct arithmetic over a wrong model. Channels are not interchangeable.
  channel_response:
    whatsapp: 1.30
    sms: 1.00
    voice: 1.50
    email: 0.50

# What fraction of escalated cases a human actually resolves.
#
# An earlier 0.55 at ₹40 made human review positive-EV on a ₹400 payment, which
# is not credible: an ops person cannot resolve more than half of arbitrary
# payment failures, and ₹40 does not buy the fifteen minutes it takes to try.
#
# Note this stays positive-EV above roughly ₹1,200, which is still low. That is
# correct and deliberate: the arithmetic says escalation is often *worth* it,
# while compliance.yaml caps it at ₹50,000 and 50 per run because human capacity
# is finite. Value and capacity are different constraints and are expressed in
# different places.
escalation_success_rate: 0.35

# The shadow price of one human's attention.
#
# Compliance allows 50 escalations per run against roughly 1,600 failures. Spending
# one on a ₹2,500 payment forecloses spending it on a ₹90,000 one, and that
# opportunity cost is real even though no invoice records it. Without it the policy
# proposed escalation for nearly every payment and compliance refused it ~1,450
# times — arithmetically defensible, operationally nonsense, and it buried the
# refusal list under noise.
#
# Priced so that escalation only competes where the amount genuinely warrants a
# person. Scarcity belongs in the cost, not only in the cap.
escalation_scarcity_premium: 90000

# ---------------------------------------------------------------------------
# Scheduling
# ---------------------------------------------------------------------------
# Candidate retry offsets, in hours. The policy scores each against the learned
# hour-of-day model and picks the best that survives compliance.
retry_offsets_hours: [0, 1, 4, 12, 24, 48, 72, 120]

# Value decays with delay. Without this the optimiser always waits for the single
# best hour of the month, because a distant retry has a better success rate and
# costs the same — ignoring that the customer buys elsewhere, the cart goes cold,
# and the merchant's cash sits still. The decay is what creates a real tradeoff
# between "soon" and "when it is most likely to work".
delay_decay_per_day: 0.12

# INSUFFICIENT_FUNDS is payday-sensitive, but the agent is not told that. It is
# given a month-phase feature (early / mid / late) and has to discover from
# outcomes that early-month retries recover better. This is the horizon it may
# schedule ahead to reach one.
payday_lookahead_days: 6

# ---------------------------------------------------------------------------
# Downtime scheduling
# ---------------------------------------------------------------------------
# How long to wait before reconsidering a payment deferred by an outage. Whether
# an outage should block a retry at all is a behavioural rule and lives in
# compliance.yaml — this is only the timing.
downtime:
  recheck_minutes: 15
  max_defer_hours: 12

# Below this expected value, do nothing. A positive but negligible EV is not
# worth the customer contact or the operational noise.
ev_threshold_paise: 500
